    Q 64 40, 66 46
    Q 70 48, 76 52
    Q 82 56, 88 58
    Q 94 60, 102 62
    L 115 64
    Q 110 66, 102 67
    Q 94 68, 86 68
    Q 78 68, 72 66
    Q 68 70, 64 76
    L 60 84
    L 58 78
    Q 54 82, 50 78
    L 48 84
    L 46 76
    Q 42 72, 38 68
    Q 34 64, 32 58
    Q 30 54, 28 52
    Q 24 54, 18 54
    Q 12 54, 8 52
