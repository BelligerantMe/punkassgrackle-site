<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5a7b;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="grackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b3fa0"/>
      <stop offset="35%" style="stop-color:#1a936f"/>
      <stop offset="65%" style="stop-color:#a67c52"/>
      <stop offset="100%" style="stop-color:#2d5a7b"/>
    </linearGradient>
    <!-- Punk grackle silhouette - bird shape with mohawk -->
    <path id="grackle-shape" d="M 8 52 L 2 50 L 8 48 Q 12 47, 18 45 Q 24 43, 30 42 Q 36 41, 40 42 Q 44 38, 46 32 L 44 24 L 48 30 L 47 20 L 51 28 L 50 16 L 54 26 L 53 14 L 57 24 Q 60 28, 62 34 Q 64 40, 66 46 Q 70 48, 76 52 Q 82 56, 88 58 Q 94 60, 102 62 L 115 64 Q 110 66, 102 67 Q 94 68, 86 68 Q 78 68, 72 66 Q 68 70, 64 76 L 60 84 L 58 78 Q 54 82, 50 78 L 48 84 L 46 76 Q 42 72, 38 68 Q 34 64, 32 58 Q 30 54, 28 52 Q 24 54, 18 54 Q 12 54, 8 52 Z"/>
    <!-- Simple eye for background grackles -->
    <g id="grackle-eye">
      <circle cx="52" cy="38" r="3" fill="white" fill-opacity="0.3" stroke="none"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0a0a0f"/>

  <!-- Horizon glow -->
  <ellipse cx="960" cy="800" rx="1200" ry="200" fill="url(#gridGrad)"/>

  <!-- Vertical lines converging to grackle-shaped vanishing point -->
  <g stroke="#6b3fa0" stroke-opacity="0.3" fill="none">
    <!-- Lines converge toward point that suggests bird head profile at ~960,720 -->
    <path d="M0,1080 Q480,900 960,720"/>
    <path d="M240,1080 Q600,880 960,720"/>
    <path d="M480,1080 Q720,860 960,720"/>
    <path d="M720,1080 Q840,820 960,720"/>
    <path d="M960,1080 L960,720"/>
    <path d="M1200,1080 Q1080,820 960,720"/>
    <path d="M1440,1080 Q1200,860 960,720"/>
    <path d="M1680,1080 Q1320,880 960,720"/>
    <path d="M1920,1080 Q1440,900 960,720"/>
  </g>

  <!-- Horizontal lines with subtle curve suggesting bird silhouette -->
  <g stroke="#1a936f" stroke-opacity="0.2" fill="none">
    <path d="M0,1000 Q960,980 1920,1000"/>
    <path d="M0,920 Q960,880 1920,920"/>
    <path d="M0,840 Q960,780 1920,840"/>
    <path d="M0,760 Q960,700 1920,760"/>
  </g>

  <!-- Subtle grackle silhouettes scattered in background -->
  <g fill="url(#grackleGrad)" opacity="0.08">
    <!-- Upper left grackle - small, looking right -->
    <use href="#grackle-shape" transform="translate(120, 80) scale(1.2)"/>
    <use href="#grackle-eye" transform="translate(120, 80) scale(1.2)"/>
    <!-- Lower right grackle - larger, looking left (flipped) -->
    <use href="#grackle-shape" transform="translate(1750, 550) scale(-1.8, 1.8)"/>
    <use href="#grackle-eye" transform="translate(1750, 550) scale(-1.8, 1.8)"/>
    <!-- Mid-right grackle - tiny accent -->
    <use href="#grackle-shape" transform="translate(1500, 180) scale(0.7) rotate(-10)"/>
    <use href="#grackle-eye" transform="translate(1500, 180) scale(0.7) rotate(-10)"/>
  </g>
</svg>
